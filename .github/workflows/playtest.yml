# A playtest release, started by `python -m saturnrecomp.playtest game.toml publish` (see saturn-recomp's
# playtest-release.yml). PLAYTEST_CI_TOKEN is the playtest Worker's CI_TOKEN.
name: playtest

on:
  workflow_dispatch:
    inputs:
      build:
        description: the build id `publish` printed
        required: true

jobs:
  release:
    uses: callumjenkins/saturn-recomp/.github/workflows/playtest-release.yml@main
    with:
      build: ${{ inputs.build }}
    secrets:
      ci_token: ${{ secrets.PLAYTEST_CI_TOKEN }}
    permissions:
      contents: write
