[game]
name = "Saturn Bomberman (USA)"
seeds = "seeds.json"
build = "build"
cmake = ["SATURN_VDP1_GPL=ON", "SATURN_EXTRA={root}/decomp/swap.cmake"]     # VDP1 by Mednafen's rules: builds are GPL (saturn-recomp THIRD_PARTY.md)

# What the disc holds and what became of each part: python -m saturnrecomp.inventory game.toml.
[inventory]
manifest = "disc.json"
files = "build/extract"
treatments = "inventory.tsv"

# The 68000 sound drivers, which the runtime interprets on Musashi. Each starts with its vector table and
# loads at sound RAM's start.
[[inventory.sound]]
name = "SND"
source = "/BOMSS/PROGRAM.BIN"
offset = 0x44
bytes = 0x63D4

[[inventory.sound]]
name = "XBSND"
source = "/XBAND/XBAND.DAT"
offset = 0x11868
bytes = 0x63D4

[[inventory.sound]]
name = "NLSND"
source = "/NETLINK/SNDDRV.BIN"

# Builds for playtesters: saturn-recomp's playtest/README.md. Their sessions are measured against the
# routes' and the clears' coverage.
[playtest]
endpoint = "https://saturn-playtest.colour-clock-cloud.workers.dev"
repo = "callumjenkins/pc-saturnbomberman"
disc = "disc.json"
coverage = ["build/test/*/coverage.txt", "build/run/*/coverage.txt", "build/play/*/replay/coverage.txt"]
boxart = "https://cdn.thegamesdb.net/images/original/boxart/front/11326-1.jpg"   # TheGamesDB's, the US box
classes = "coverage-classes.tsv"   # code the coverage report sets aside: online, dead in every release, cut

# The Japanese release's voices, from the player's own Japanese disc (T-14302G): Dr. I's radio calls
# (M_058-M_067, byte for byte the Japanese files), the opening movie in Japanese, and the title's voice
# (audio track 2).
[playtest.other_disc]
label = "Japanese voices"
disc = "disc-jp.json"
files = "/BOMSS/M_058.AIF=/M_058.AIF,/BOMSS/M_059.AIF=/M_059.AIF,/BOMSS/M_060.AIF=/M_060.AIF,/BOMSS/M_061.AIF=/M_061.AIF,/BOMSS/M_062.AIF=/M_062.AIF,/BOMSS/M_063.AIF=/M_063.AIF,/BOMSS/M_064.AIF=/M_064.AIF,/BOMSS/M_065.AIF=/M_065.AIF,/BOMSS/M_066.AIF=/M_066.AIF,/BOMSS/M_067.AIF=/M_067.AIF,/BOMSS/BOMSS2.CPK=/BOMSS2.CPK"
tracks = "2"
cue = "iso-jp/Saturn Bomberman (JP).cue"

# A stage start in Normal Game, which a session's Continue rebuilds through the stage select when the
# session's dump won't load (saturn-recomp's playtest/README.md). stage_2 changes as each stage loads,
# while the bomber still has what it carries over. Stage 1-1, a world's intro (stage FF), Master Game
# (08xx) and the battles (09xx) are left to the dump or the replay.
[checkpoint]
keep = [["stage_2", 2], ["score", 8], ["lives", 1], ["dino_colours", 1], ["growth_points", 20],
        ["objects+0x37", 1], ["objects+0x3A", 4], ["objects+0x5E", 1], ["objects+0x64", 2], ["objects+0x6E", 2],
        ["objects+0x70", 2], ["objects+0x43", 1], ["objects+0x80", 2], ["awarded_score", 8], ["dino_sizes", 5]]
accept = [[0x0001, 0x0006], [0x0100, 0x0108], [0x0200, 0x0208], [0x0300, 0x0309], [0x0400, 0x0409]]
presses = ["1900:START", "1910:", "2500:START", "2510:", "3000:START", "3010:", "3400:START", "3410:",
           "4200:START", "4210:", "4500:START", "4510:"]
writes = ["4250:stage=stage_2", "4250:stage_2", "4250:stage_3=stage_2", "4250:stage_saved=stage_2",
          "4600:score", "4600:lives", "4600:dino_colours", "4600:growth_points", "4600:objects+0x37",
          "4600:objects+0x3A", "4600:objects+0x5E&08", "4600:objects+0x64", "4600:objects+0x6E", "4600:objects+0x70",
          "4600:objects+0x7E=objects+0x64", "4600:objects+0x7C=objects+0x6E",
          "4600:objects+0x43", "4600:objects+0x80", "4600:awarded_score", "4600:dino_sizes"]
resume = 4610
show = [["Stage {}", "stage_2", "world-stage"], ["{} pts", "score", "u32"], ["Lives {}", "lives", "u8"],
        ["Fire {}", "objects+0x64", "u16"], ["Bombs {}", "objects+0x6E", "u16"], ["Speed +{}", "objects+0x3A", "u8@3?"],
        ["Hearts +{}", "objects+0x37", "u8?"], ["{}", "objects+0x70", "bits:01=Kick,02=Glove?"],
        ["{} dino", "dino_colours", "names:,Pink,Blue,Green,Yellow,Purple?", "objects+0x5E&08"]]

[symbols]
krnl_setjmp = 0x060061C4
krnl_longjmp = 0x060061E6
krnl_yield = 0x06006D36             # the scheduler's yield
# The kernel's task blocks, which its scheduler (06006C00) walks: a krnl_setjmp buffer at +32 in each.
task_blocks = 0x060BC190
bomber_hit_flag = 0x0606CF2E        # in the hit routine, where r2 holds the 0x40 it ORs into a bomber's flags
bomber_fire_under = 0x06015516      # in the bomber update, where r0 holds the fire map entry under the bomber
bomber_touched = 0x0605E512         # in the touch check, where r3 holds the object state word; any of bits 0x1228 skips the hit
# The stage's objects, 0x7C bytes each: slots 0-9 the bombers, enemies from 10. At +0x30 the update
# function (idle_object when the slot is free), +0x34 flags (0x80 gone, 0x40 hit), +0x44 the cell,
# +0x48 and +0x4C x and y in 16.16 pixels. A bomber's flags have 0x20 while it wears the vest, and the
# word at +0x56 counts the vest's VBlanks down. Its byte at +0x37 is its hearts, the word at +0x3A its speed
# (0xE000 at Normal Game's start, 0 in a battle; a skate adds 0x2000, a geta takes it) and the byte at +0x3D
# its skates, which go together: a speed without its count leaves the bomber stuck. +0x43 the map bits that
# stop it (bomb pass clears 0x20, wall pass 0x10), +0x54 the slot of the dino it rides, +0x5A or +0x5B a
# skull's or a devil's illness with its VBlanks in the word at +0x5C, +0x5E has 0x0800 while it rides a dino,
# +0x64 its fire, +0x6C its bombs, the word at +0x6E how many it can have out (a bomb-up adds 1), +0x78 item
# 22's VBlanks, and the words at +0x7C and +0x7E the bombs and fire it has collected, which the game copies
# back into +0x6E and +0x64 (capped at 10 and 16) now and then. The byte at +0x70 holds its abilities (0x01
# kick, 0x02 glove, 0x04 line bomb, 0x08 item 15's) and +0x71 its bomb kind (one bit each for items 4, 13, 14, 20, 23 and 24).
objects = 0x060D5F00
idle_object = 0x060143D8
dino = 0x0601B5CC                   # a dino's update function; its object's +0x54 is its rider's slot, +0x64 the eggs it has eaten since, +0x70 its colour
# A byte a bomber slot: the colour of the dino the bomber is created riding, when its +0x5E has 0x0800 then.
# 1 pink (jumps), 2 blue (kicks bombs into the air), 3 green (dashes), 4 yellow (roars), 5 purple (sound
# waves); 0, 6 and 7 draw other dinos. A battle clears it, and the bombers' fields, about 20 VBlanks before
# it creates them.
dino_colours = 0x060D82D4
# Normal Game's growth meter (the HUD's egg): a long per bomber slot and dino colour, at 20 × slot + 4 × (colour - 1).
# Every point a bomber scores while riding goes into its dino's colour, and the total is never reset during a game.
# A dino starts a stage at its first size under 5000, its second under 15000, and its last from there.
growth_points = 0x060D82DC
# The size each colour's next egg hatches at, one byte per colour for pad 1.
dino_sizes = 0x060D8304
clock_freeze = 0x060C0FFC           # a word: the clock item's VBlanks left, while the stage's timer stands still
core_mechanism = 0x0607466C         # the update function of a Core Mechanism: the exit opens once none is left
# Mr. Meanie's mech (5-9), whose body is slot 10, takes a hit, on the body or on the side part out, when one
# cell burns: the body's point moved up 32 pixels, then down 16 for each side part destroyed (meanie_parts_lost) and for
# each part out and attacking (meanie_parts_out less meanie_parts_lost). While a part is out, the cell moves by
# meanie_offsets' signed word for meanie_phase, and from phase 3 no cell counts.
meanie_parts_out = 0x060C31F0
meanie_parts_lost = 0x060C31EE
meanie_phase = 0x060C31EA
meanie_offsets = 0x060BB5F8
# The stage map: 64x64 cells, a word each, the cell (x, y) at y*64+x. 0x80 solid (walls, hard blocks,
# a standing enemy), 0x40 an item, 0x10 soft block, 0x20 bomb, the low 3 bits fire.
cells = 0x060EC8B0
# Items: a word a cell, laid out as cells, whose low byte is the cell's slot in item_slots (0: none). A
# soft block whose word names a slot drops that slot's item when it breaks.
hidden_items = 0x060F08B0
item_slots = 0x060DFB96             # 8 bytes a slot, slots 1-75: the byte at +5 is the item's kind (routes.ITEM_KINDS)
exit_cell = 0x060D7E8C              # a word: the cell the exit opens on once no enemy is left
# World then stage, a byte each, both from 0. The routine that starts Normal Game sets all four pairs,
# to the held code's world or to stage_saved's when continuing; a stage select writes them after it.
stage = 0x060C179A
stage_2 = 0x060C029C
stage_3 = 0x060C029E
stage_saved = 0x060C17A0
score = 0x060C0690                  # a long a pad: its Normal Game score
random_index = 0x060BF4F4           # the 55-entry random generator's index; its table follows
# The score already checked for extra-life thresholds, a long per pad.
awarded_score = 0x060C0FDC
# H2H's connection state (06002FB8), as its entry at 06002F24 returned it at boot: 0 unless the NetLink's UART
# passed the scratch-register test, then 1 for the answering side and 2 for the side that dialled.
# Battles, the bonus game and the results take their online paths when it is not 0.
link_mode = 0x060C0AA8
lives = 0x060C063E                  # a byte: pad 1's lives left in Normal Game: 3 at its start, 0 while the last is played
# The kernel counts, for each pad port from 06006100, the VBlanks since that port's pad last changed, as
# it reads the pads, so not while the game loads. With nothing in port 3, its count is the game's frames.
tick = 0x06006108
# The SMPC's clock as the game last read it, in BCD: seconds, minutes, hours, the day, the weekday then the
# month in one byte, and the year's last two digits then its first two. Another copy follows at 060FA940.
clock_copy = 0x060FA939

# The boot chain: the NetLink loader /0, its trampoline, the launcher, IP.BIN as the launcher
# leaves it, the loader FLD_KNL, the XBAND library and the game's kernel. `bomberman prepare` makes
# tramp.bin and ip-patched.bin. Where two load at one address, the log shows which one ran.
[[module]]
name = "BOOT"
file = "build/extract/0"
base = 0x06010000

[[module]]
name = "TRAMP"
file = "build/tramp.bin"
base = 0x00200000
source = "/0"
source_offset = 0x3B4B0

[[module]]
name = "XS"
file = "build/extract/NETLINK/XS028000.EXE"
base = 0x00280000

[[module]]
name = "IP"
file = "build/ip-patched.bin"
base = 0x06002000
source = "/SAMPLEIP.BIN"
seeds = [0x06002100, 0x06002E20]

[[module]]
name = "FLD"
file = "build/extract/FLD_KNL.BIN"
base = 0x00200000
seeds = [0x002001A4]

[[module]]
name = "H2H"
file = "build/extract/XBAND/H2HLIBUS.BIN"
base = 0x06002F00
seeds = [0x06003320]

# The XBAND client, which XS loads over the kernel's space for QuickLink (mode 6): direct dial,
# the lobby's match-ups and mail. XS enters it at 06006002.
[[module]]
name = "XBAND"
file = "build/extract/XBAND/XBAND.BIN"
base = 0x06006000
seeds = [0x06006002]

[[module]]
name = "KRNL"
file = "build/extract/BOMSS/0KRNL.BIN"
base = 0x06006000

[tasks]
module = "KRNL"
setjmp = "krnl_setjmp"
longjmp = "krnl_longjmp"
yields = ["krnl_setjmp", "krnl_yield"]
unknown_yields = true

# The XBAND client's kernel switches tasks through 06006062: it saves every register on the running
# task's stack, stores that stack pointer in the task's block, asks its scheduler for the next and loads
# that one's, then pops into it with rte. The saved task resumes 84 bytes up its stack, at its caller's PR.
# System calls go through 06006110's jump table, and some of them wait in the switch.
[[task_switch]]
module = "XBAND"
save = 0x06006098
save_key = "r1"
resume_sp = 84
switch = 0x060060C4
switch_key = "r0"
yields = [0x06006110]
unknown_yields = true

# A second way in, at 0600CA58 (its scheduler is 0600C9E0), with the same 84-byte frame.
[[task_switch]]
module = "XBAND"
save = 0x0600CA88
save_key = "r0"
resume_sp = 84
switch = 0x0600CA94
switch_key = "r0"

[[hook]]
module = "KRNL"
at = "bomber_hit_flag"

[[hook]]
module = "KRNL"
at = "bomber_fire_under"

[[hook]]
module = "KRNL"
at = "bomber_touched"

